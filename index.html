// ── ShipGrid class ──────────────────────────────────────────
class ShipGrid {
  constructor(canvasId, imgSrc, cols, rows) {
    this.canvas = document.getElementById(canvasId);
    this.ctx    = this.canvas.getContext('2d');
    this.cols   = cols;
    this.rows   = rows;
    this.tiles  = [];
    this.state  = 'idle';
    this.animId = null;
    this.img    = null;
 
    const img = new Image();
    img.onload = () => {
      this.img = img;
      this.canvas.width  = img.naturalWidth;
      this.canvas.height = img.naturalHeight;
      this._buildTiles();
      this.state = 'grid';
      this._draw();
    };
    img.src = imgSrc;
  }
 
  _buildTiles() {
    const tw = this.img.naturalWidth  / this.cols;
    const th = this.img.naturalHeight / this.rows;
    this.tiles = [];
    for (let r = 0; r < this.rows; r++) {
      for (let c = 0; c < this.cols; c++) {
        this.tiles.push({
          sx: c*tw, sy: r*th, tw, th,
          x:  c*tw, y:  r*th,
          vx: 0, vy: 0,
          home: { x: c*tw, y: r*th }
        });
      }
    }
  }
 
  _draw() {
    const { ctx, canvas, img, tiles, cols, rows } = this;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    tiles.forEach(t => ctx.drawImage(img, t.sx, t.sy, t.tw, t.th, t.x, t.y, t.tw, t.th));
    if (this.state === 'grid') {
      ctx.strokeStyle = 'rgba(255,255,255,0.55)';
      ctx.lineWidth = 1.5;
      for (let c=1; c<cols; c++) { ctx.beginPath(); ctx.moveTo(c*canvas.width/cols,0); ctx.lineTo(c*canvas.width/cols,canvas.height); ctx.stroke(); }
      for (let r=1; r<rows; r++) { ctx.beginPath(); ctx.moveTo(0,r*canvas.height/rows); ctx.lineTo(canvas.width,r*canvas.height/rows); ctx.stroke(); }
    }
  }
 
  toggle() {
    if (this.state === 'grid') this._disperse();
    else if (this.state === 'done') this._reassemble();
  }
 
  _disperse() {
    this.state = 'dispersing';
    const cx = this.canvas.width/2, cy = this.canvas.height/2;
    this.tiles.forEach(t => {
      const a = Math.atan2(t.y+t.th/2-cy, t.x+t.tw/2-cx);
      const s = 10 + Math.random()*14;
      t.vx = Math.cos(a)*s; t.vy = Math.sin(a)*s;
    });
    this._animate();
  }
 
  _reassemble() {
    this.state = 'reassembling';
    this._animate();
  }
 
  _animate() {
    cancelAnimationFrame(this.animId);
    const step = () => {
      if (this.state === 'dispersing') {
        let done = true;
        this.tiles.forEach(t => { t.x+=t.vx; t.y+=t.vy; t.vx*=0.95; t.vy*=0.95; if(Math.hypot(t.vx,t.vy)>0.4) done=false; });
        this._draw();
        if (done) { this.state='done'; return; }
      } else if (this.state === 'reassembling') {
        let done = true;
        this.tiles.forEach(t => { const dx=t.home.x-t.x, dy=t.home.y-t.y; t.x+=dx*.1; t.y+=dy*.1; if(Math.abs(dx)>.8||Math.abs(dy)>.8) done=false; });
        this._draw();
        if (done) { this.tiles.forEach(t=>{t.x=t.home.x;t.y=t.home.y;}); this.state='grid'; this._draw(); return; }
      }
      this.animId = requestAnimationFrame(step);
    };
    this.animId = requestAnimationFrame(step);
  }
}
